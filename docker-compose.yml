services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowline}
      POSTGRES_DB: ${POSTGRES_DB:-flowline}
    # Наружу база намеренно не публикуется. Приложению это не нужно — api
    # ходит в неё по внутренней сети compose, — а на хосте порт 5432 занят
    # чаще, чем свободен: локальный Postgres есть почти у всех, и свежий клон
    # падал бы на «address already in use» до первого запуска. Порт на хост
    # выводит docker-compose.dev.yml, где он и нужен: для тестов и psql.
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Скрипты отсюда Postgres выполняет один раз — при инициализации пустого
      # тома. Здесь создаётся база для тестов: без неё первый же прогон падает
      # на «database flowline_test does not exist», а починка требует помнить
      # отдельную команду createdb, которую негде подсмотреть в момент падения.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowline}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Переопределяет DATABASE_URL из .env: тот адрес — для запуска с хоста
      # (тесты, локальный uvicorn), где база слушает на localhost:${DB_PORT}.
      # Внутри сети compose своего localhost у контейнера нет — «localhost»
      # там означает сам контейнер api, а не db, поэтому адрес пересобирается
      # явно на сервис db и его внутренний порт 5432 (DB_PORT управляет
      # только публикацией наружу и к внутреннему адресу отношения не имеет).
      # environment имеет приоритет над env_file, так что .env продолжает
      # обслуживать хост без изменений.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowline}:${POSTGRES_PASSWORD:-flowline}@db:5432/${POSTGRES_DB:-flowline}
    depends_on:
      db: {condition: service_healthy}
    # Наружу api, как и база, не публикуется: снаружи он и так доступен —
    # через 8080, где Caddy отдаёт /api/* в него же. 8000 — порт занятой
    # судьбы (второй uvicorn, чужой проект), и ради дубля того, что уже есть
    # на 8080, свежий клон падал бы с «port is already allocated». Прямой
    # доступ к api нужен при разработке — там его и открывает
    # docker-compose.dev.yml.
    # Схема накатывается перед стартом сервера, а не «когда-нибудь руками»:
    # иначе свежая установка поднимает uvicorn поверх пустой базы, и это
    # незаметно, потому что единственный маршрут, который не ходит в базу
    # (/api/health), продолжает отвечать «ok». `&&` обязателен: если миграция
    # не прошла, сервер не должен подняться и делать вид, что всё в порядке.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Проверка живости идёт через python, а не curl или wget: в python-slim нет
    # ни того, ни другого, и healthcheck на них молча висел бы в unhealthy.
    # start_period покрывает время миграций — до их конца сервер не отвечает,
    # и без запаса контейнер успел бы объявить себя больным на здоровом старте.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  backup:
    # Ежесуточный pg_dump в ./backups на хосте — см. docker/backup.sh.
    # Отдельный контейнер, а не cron внутри db: официальный образ Postgres
    # не запускает ничего, кроме сервера, и любая самодеятельность внутри него
    # теряется при обновлении образа. Тот же образ postgres:16 — чтобы версия
    # pg_dump всегда совпадала с версией сервера.
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-flowline}
      POSTGRES_USER: ${POSTGRES_USER:-flowline}
      POSTGRES_DB: ${POSTGRES_DB:-flowline}
      # Как часто снимать дамп и сколько суток держать старые.
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      # Дампы лежат на хосте, не в томе Docker: смысл бэкапа — пережить
      # `docker compose down -v`, который сносит тома вместе с данными.
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: {condition: service_healthy}

  web:
    # Контекст сборки — корень, а не ./frontend: в образ нужен и Caddyfile,
    # который лежит рядом с compose, а контекст из frontend/ его не видит.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    # Ожидание готовности, а не просто старта: Caddy проксирует /api в api, и
    # запросы, пришедшие до конца миграций, получили бы 502 на пустом месте.
    depends_on:
      api: {condition: service_healthy}
    ports: ["${WEB_PORT:-8080}:8080"]

volumes:
  pgdata:
