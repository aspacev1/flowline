# Обязательные темы интервью.
#
# Файлом конфигурации рядом с приложением, а не в базе: править его будет тот,
# кто разворачивает, а не пользователь. Перенос в настройки организации — когда
# появится спрос на отраслевые шаблоны интейка.
#
# key    — машинный ключ темы, по нему модель отмечает закрытые темы;
# prompt — подсказка модели, о чём спросить, на языке разработки. Вопрос
#          человеку модель формулирует сама и на языке сессии.
topics:
  - key: goal
    prompt: Цель проекта — какой результат считается успехом
  - key: scope
    prompt: Объём работ — что именно предстоит сделать
  - key: deadline
    prompt: Сроки и целевая дата
  - key: people
    prompt: Кто участвует и кто за что отвечает
  - key: constraints
    prompt: Ограничения — бюджет, технологии, согласования, зависимости от других
  - key: done
    prompt: Что уже готово или начато
  - key: out_of_scope
    prompt: Что в проект точно не входит
