# Наложение для работы с кодом на своей машине. Запускается вместе с базовым
# файлом, а не вместо него:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Отличие от обычного запуска одно: исходники не запекаются в образ, а
# монтируются с хоста, и оба сервера перечитывают их сами. Правка файла в
# редакторе видна в браузере без пересборки и без перезапуска compose.
services:
  db:
    # База выводится на хост только здесь: с ней работают тесты, запущенные
    # снаружи контейнера (`cd backend && uv run pytest`), и psql под рукой.
    # Если 5432 занят локальным Postgres, задай в .env другой DB_PORT — и тем
    # же значением поправь порт в DATABASE_URL: тесты берут адрес оттуда, и
    # разъехавшись, эти два места дают отказ в подключении на пустом месте.
    ports: ["${DB_PORT:-5432}:5432"]

  api:
    # Прямой доступ к бэкенду, минуя Caddy: /docs, /redoc и curl по адресам
    # API, а ещё `npm run dev` на хосте — его прокси по умолчанию смотрит
    # именно на localhost:8000. Занят другим — задай API_PORT в .env.
    ports: ["${API_PORT:-8000}:8000"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    volumes:
      # Рабочая копия поверх /app. Виртуальное окружение лежит в /opt/venv
      # (см. backend/Dockerfile) и этим монтированием не задевается.
      - ./backend:/app
    # --reload вместо простого запуска: uvicorn сам следит за файлами в /app.
    # Миграции накатывает сервис migrate из базового файла — но по коду,
    # запечённому в образ. Правишь миграции — пересобери его:
    #   docker compose ... up --build migrate
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    # target: dev — стадия с Vite вместо стадии с Caddy. Порт снаружи тот же
    # (${WEB_PORT:-8080}), поэтому адрес приложения в разработке и в обычном
    # запуске совпадает и не приходится помнить, какой из них сейчас верный.
    build:
      target: dev
    environment:
      # Прокси Vite (frontend/vite.config.ts) по умолчанию смотрит на
      # localhost:8000 — внутри контейнера это он сам, а не бэкенд.
      API_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      # Анонимный том поверх node_modules: без него монтирование ./frontend
      # закрыло бы зависимости, установленные при сборке образа, каталогом с
      # хоста — пустым на свежем клоне или собранным под другую ОС.
      # После правки package.json образ нужно пересобрать вместе с этим томом:
      #   docker compose ... up --build --renew-anon-volumes web
      - /app/node_modules
